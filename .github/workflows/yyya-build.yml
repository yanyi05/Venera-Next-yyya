name: yyya Windows 与 iPhone 构建
run-name: yyya Windows 与 iPhone · ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      build_windows:
        description: 构建 Windows 安装包
        type: boolean
        default: true
      build_ios:
        description: 构建 iPhone IPA（需要自行签名）
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      build_android: false
      build_windows: ${{ inputs.build_windows }}
      build_macos: false
      build_ios: ${{ inputs.build_ios }}
      build_linux_x64: false
      build_linux_arm64: false
    secrets: inherit
